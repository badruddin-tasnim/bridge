name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android App (Kotlin)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: Bridge-Android-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk

  build-macos:
    name: Build macOS Menu Bar App (Swift)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mac-app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Bridge.app
        run: make clean && make

      - name: Package Bridge.app archive
        run: ditto -c -k --sequesterRsrc --keepParent Bridge.app Bridge-macOS.zip

      - name: Upload macOS App artifact
        uses: actions/upload-artifact@v7
        with:
          name: Bridge-macOS-App
          path: mac-app/Bridge-macOS.zip
