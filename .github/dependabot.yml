version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/android-app"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      android-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns:
          - "*"
