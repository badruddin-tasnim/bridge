name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android Release Asset
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build Android APK
        working-directory: android-app
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK for Release
        run: |
          TAG_NAME="${{ github.event.inputs.tag || github.ref_name }}"
          cp android-app/app/build/outputs/apk/debug/app-debug.apk "Bridge-${TAG_NAME}-Android.apk"

      - name: Upload Android asset
        uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: Bridge-*-Android.apk

  build-macos:
    name: Build macOS Release Asset
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build & Package Bridge.app
        run: |
          TAG_NAME="${{ github.event.inputs.tag || github.ref_name }}"
          cd mac-app
          make clean && make
          ditto -c -k --sequesterRsrc --keepParent Bridge.app "../Bridge-${TAG_NAME}-macOS.zip"

      - name: Upload macOS asset
        uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: Bridge-*-macOS.zip

  publish-release:
    name: Publish GitHub Release
    needs: [build-android, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download built assets
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 Checksums
        working-directory: dist
        run: sha256sum Bridge-* > SHA256SUMS.txt

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Bridge ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/Bridge-*-Android.apk
            dist/Bridge-*-macOS.zip
            dist/SHA256SUMS.txt
